name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -v
      - run: python -m py_compile workbench/*.py
      - run: node --check workbench/static/app.js
      - run: git diff --check
      - run: docker build -t backgrounds-workbench:test .
