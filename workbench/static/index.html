<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Investigator Workbench</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/" aria-label="Investigator Workbench home">
        <span class="brand-mark" aria-hidden="true">IW</span>
        <span><strong>Investigator</strong><small>Workbench</small></span>
      </a>
      <nav>
        <a class="nav-link active" href="#/" data-route="dashboard"><span aria-hidden="true">⌂</span> Caseload</a>
        <a class="nav-link" href="#/guide" data-route="guide"><span aria-hidden="true">≡</span> Desk guide</a>
        <a class="nav-link" href="#/account" data-route="account"><span aria-hidden="true">⚙</span> Account</a>
      </nav>
      <div class="privacy-note"><span aria-hidden="true">●</span><div><strong>Local workspace</strong><small>Case files stay on this device</small></div></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="mobile-menu" id="menuButton" aria-label="Toggle navigation">☰</button>
        <div class="crumb" id="crumb">Caseload</div>
        <div class="top-actions"><span class="today" id="today"></span><form method="post" action="/logout"><button class="secondary" type="submit">Sign out</button></form><button class="primary" id="newCaseButton">New case</button></div>
      </header>
      <div id="app" class="content" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <header><div><p class="eyebrow" id="modalEyebrow">Add record</p><h2 id="modalTitle">New item</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer><button class="secondary" value="cancel">Cancel</button><button class="primary" value="default" id="modalSubmit">Save</button></footer>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
